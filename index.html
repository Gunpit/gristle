<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Gristle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Special+Elite&family=VT323&display=swap">
<style>
/* Layout: one 800x560 stage, rendered at 320x224 and dithered (PS1-era), scaled up; terse ledger cards float over it. Single dark look. */
:root {
  --void: #0a0908;
  --paper: #1b1814;
  --edge: #3a3128;
  --bone: #d9cfb8;
  --dim: #8c826f;
  --blood: #8e1b12;
  --bile: #9da35a;
  --display: "IM Fell English SC", "Times New Roman", serif;
  --body: "Special Elite", "Courier New", monospace;
  --pix: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--void); color: var(--bone); font-family: var(--body);
  margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.stage {
  position: relative; width: 100%; max-width: 960px; aspect-ratio: 800 / 560;
  max-height: calc(100vh - 80px); container-type: inline-size; overflow: hidden;
  box-shadow: 0 0 0 1px #2a241e, 0 30px 80px #000;
}
@supports (max-height: 1dvh) { .stage { max-height: calc(100dvh - 80px); } }
canvas#cv { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
canvas#cu { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 8; cursor: pointer; touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 3cqw; background: rgba(5, 4, 3, .62); overflow-y: auto; overflow-x: hidden;
}
.card {
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix values='0 0 0 0 .12 0 0 0 0 .09 0 0 0 0 .06 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse at 30% 20%, #241f19, var(--paper) 70%);
  color: var(--bone); border: 1px solid var(--edge);
  padding: clamp(14px, 3cqw, 30px); width: min(100%, 540px);
  display: grid; grid-template-columns: auto 1fr; gap: clamp(12px, 2.6cqw, 24px); align-items: center;
  box-shadow: inset 0 0 40px rgba(0,0,0,.7), 0 20px 50px rgba(0,0,0,.6);
  position: relative; margin: auto;
}
.card.wide { width: min(100%, 760px); grid-template-columns: 1fr; }
.card.solo { grid-template-columns: 1fr; text-align: center; justify-items: center; }
.portrait { width: clamp(80px, 18cqw, 160px); height: auto; aspect-ratio: 1; image-rendering: pixelated; border: 1px solid var(--edge); background: #000; }
.txt { min-width: 0; display: grid; gap: clamp(6px, 1cqw, 12px); }
.eyebrow { font-family: var(--pix); font-size: clamp(14px, 2cqw, 18px); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: .95; text-wrap: balance; }
h1 { font-size: clamp(54px, 15cqw, 140px); letter-spacing: .04em; color: var(--bone); text-shadow: 3px 3px 0 var(--blood), 0 0 30px rgba(142,27,18,.4); }
h2 { font-size: clamp(24px, 4.6cqw, 42px); }
p { margin: 0; font-size: clamp(13px, 2cqw, 17px); line-height: 1.5; }
.omen { font-family: var(--display); font-style: italic; font-size: clamp(16px, 2.8cqw, 24px); color: #c9a49a; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: clamp(4px, 1cqw, 10px); }
.card.solo .btns { justify-content: center; }
button {
  font-family: var(--pix); font-size: clamp(18px, 2.8cqw, 26px); letter-spacing: .08em; text-transform: uppercase;
  background: var(--blood); color: var(--bone); border: 1px solid #b5372a; border-radius: 0;
  padding: .2em 1em; cursor: pointer; box-shadow: 3px 3px 0 #000;
}
button:hover { background: #a3241a; }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
button:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
button.ghost { background: transparent; border-color: var(--edge); }
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: clamp(8px, 1.6cqw, 14px); }
.dish {
  background: #12100d; border: 1px solid var(--edge); padding: 8px; text-align: left; text-transform: none; letter-spacing: 0;
  display: grid; gap: 4px; font-family: var(--body); font-size: 13px; color: var(--bone); box-shadow: 3px 3px 0 #000;
}
.dish:hover { background: #1d1813; }
.dish canvas { width: 100%; height: auto; aspect-ratio: 16/10; image-rendering: pixelated; background: #000; }
.dish strong { font-family: var(--display); font-weight: 400; font-size: clamp(17px, 2.4cqw, 21px); line-height: 1.05; }
.dish span { color: var(--dim); }
.dish[disabled] { opacity: .4; cursor: not-allowed; }
.dish .steps { font-family: var(--pix); font-size: 15px; line-height: 1.25; color: var(--dim); }
.dish .rating { color: #a3241a; letter-spacing: 3px; }
.dish .pay { font-family: var(--pix); font-size: 15px; color: #c9a49a; }
.bookhow { font-size: clamp(13px, 1.8cqw, 15px); color: var(--dim); max-width: 62ch; }
#seed { width: 6.5em; font-family: var(--pix); font-size: 20px; background: #0d0b09; color: var(--bone); border: 1px solid var(--edge); padding: .1em .4em; }
.candles { display: inline-flex; gap: 10px; align-items: flex-end; height: 34px; }
.candles i { display: block; width: 9px; height: 20px; background: #6b6152; position: relative; }
.candles i.lit { background: #cfc3a3; }
.candles i.lit::before {
  content: ""; position: absolute; left: 1px; top: -11px; width: 7px; height: 10px;
  background: #e8a040; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
  box-shadow: 0 0 10px 3px rgba(232,140,50,.5); animation: flick 1.3s infinite alternate;
}
.candles.big { height: 50px; gap: 16px; } .candles.big i { width: 13px; height: 32px; }
.candles.big i.lit::before { left: 2px; top: -14px; width: 9px; height: 13px; }
@keyframes flick { 0% { transform: scaleY(1) skewX(0); } 50% { transform: scaleY(.85) skewX(4deg); } 100% { transform: scaleY(1.1) skewX(-3deg); } }
.grade { font-family: var(--display); font-size: clamp(30px, 6.4cqw, 58px); line-height: 1; }
.scores { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--pix); font-size: clamp(15px, 2cqw, 18px); }
.scores span { border: 1px solid var(--edge); padding: 0 .5em; font-variant-numeric: tabular-nums; }
.bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 960px; gap: 12px; flex-wrap: wrap; }
.bar small { color: #5e564a; font-family: var(--pix); font-size: 16px; }
.bar button { font-size: 16px; padding: .1em .8em; background: #15120f; border-color: var(--edge); }
/* the room: a narrow ledger docked at the right, ruled rather than boxed */
.overlay.docked { justify-content: flex-end; align-items: flex-start; background: linear-gradient(90deg, rgba(5,4,3,0) 35%, rgba(5,4,3,.6)); }
.card.dock { grid-template-columns: 1fr; width: min(100%, 320px); margin: auto 0; padding: 18px 20px 20px; }
.list.tight button { padding: .32em .25em; }
.list.tight button b { font-size: 16px; }
.list.tight button em { font-size: 12px; }
.card.dock .txt { gap: 14px; }
.dayhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--edge); }
.dayhead .num { font-family: var(--display); font-size: 50px; line-height: .78; color: var(--bone); }
.dayhead .num small { display: block; font-family: var(--pix); font-size: 14px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.hours { display: flex; gap: 10px; align-items: flex-end; height: 30px; }
.hours i { display: block; width: 7px; height: 16px; background: #4a4236; position: relative; }
.hours i.lit { height: 20px; background: #cfc3a3; }
.hours i.lit::before { content: ""; position: absolute; left: 0; top: -10px; width: 7px; height: 9px; background: #e8a040; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%; box-shadow: 0 0 8px 2px rgba(232,140,50,.45); animation: flick 1.3s infinite alternate; }
.vitals { display: grid; gap: 7px; }
.stat { display: grid; grid-template-columns: 46px 1fr 26px; gap: 10px; align-items: center; font-family: var(--pix); font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.stat span:last-child { text-align: right; letter-spacing: 0; color: var(--bone); font-variant-numeric: tabular-nums; }
.stat .bar2 { height: 4px; background: #0d0b09; box-shadow: 0 0 0 1px #2a241e; }
.stat .bar2 i { display: block; height: 100%; background: var(--bone); }
.stat.low .bar2 i { background: var(--blood); box-shadow: 0 0 6px rgba(163,36,26,.7); }
.stat.low, .stat.low span:last-child { color: #c9a49a; }
.purse { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--pix); font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.purse b { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; font-size: 24px; letter-spacing: 0; color: var(--bone); }
.tooth { width: 11px; height: 13px; flex: none; }
.dayhead .tooth { width: 20px; height: 24px; color: var(--bone); }
.kept { display: flex; flex-wrap: wrap; gap: 6px; }
.kept span { border: 1px solid var(--edge); padding: 0 .5em; font-family: var(--pix); font-size: 15px; color: var(--dim); }
.sect { font-family: var(--pix); font-size: 14px; letter-spacing: .24em; text-transform: uppercase; color: #5e564a; margin-bottom: 4px; }
.list { display: grid; border-top: 1px solid var(--edge); }
.list button {
  background: none; border: 0; border-bottom: 1px solid var(--edge); box-shadow: none; border-radius: 0;
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-align: left;
  padding: .5em .25em; font-family: var(--body); font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--bone);
  transition: background .15s, padding .15s;
}
.list button:hover:not(:disabled), .list button:focus-visible { background: linear-gradient(90deg, rgba(142,27,18,.22), rgba(142,27,18,0)); padding-left: .7em; }
.list button:active { transform: none; box-shadow: none; }
.list button small { font-family: var(--pix); font-size: 15px; color: var(--dim); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.list button > span { display: grid; gap: 2px; min-width: 0; }
.list button b { font-family: var(--display); font-weight: 400; font-size: 18px; line-height: 1.1; }
.list button em { font-style: normal; font-size: 13px; color: var(--dim); }
.pips { letter-spacing: 2px; color: var(--blood); }
button:disabled { opacity: .32; cursor: not-allowed; }
.go { display: grid; gap: 10px; }
.go > button { width: 100%; padding: .35em 1em; }
.links { display: flex; justify-content: space-between; gap: 10px; }
.link { background: none; border: 0; box-shadow: none; padding: .1em 0; font-size: 17px; color: var(--dim); text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 4px; }
.link:hover { background: none; color: var(--bone); text-decoration-color: var(--blood); transform: none; }
.link:active { transform: none; box-shadow: none; }
.omen.big { font-size: clamp(19px, 3.2cqw, 26px); line-height: 1.3; color: var(--bone); }
/* the title: no box, just the word, a red rule and a short list, set against the dark */
.overlay.titled { justify-content: flex-end; background: linear-gradient(90deg, rgba(5,4,3,0) 25%, rgba(5,4,3,.8) 62%); backdrop-filter: none; }
.title { width: min(100%, 44cqw, 420px); min-width: 0; margin-right: 3cqw; display: grid; gap: 22px; }
.title h1 { font-size: clamp(44px, 10cqw, 100px); text-align: left; text-shadow: 3px 3px 0 var(--blood), 0 0 40px rgba(142,27,18,.45); animation: titleflick 7s infinite; }
.title .rule { height: 2px; background: linear-gradient(90deg, var(--blood), rgba(142,27,18,0)); margin-top: -12px; }
.title .tag { font-family: var(--display); font-style: italic; font-size: clamp(16px, 2.4cqw, 21px); color: #a8988a; margin-top: -8px; }
.title .list button { font-family: var(--display); font-size: clamp(20px, 3cqw, 27px); padding: .35em .25em; }
.title .list button small { font-size: 16px; }
.title .save { font-family: var(--pix); font-size: 16px; letter-spacing: .2em; text-transform: uppercase; color: #5e564a; }
@keyframes titleflick { 0%, 91%, 100% { opacity: 1; } 92% { opacity: .35; } 93% { opacity: 1; } 95% { opacity: .6; } 96% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .candles i.lit::before, .hours i.lit::before, .title h1 { animation: none; } .list button { transition: none; } }
@media (max-width: 520px) { .card { grid-template-columns: 1fr; } .portrait { width: 96px; } }
@media (max-width: 640px) {
  .overlay { position: fixed; inset: 0; z-index: 5; background: rgba(5,4,3,.92);
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .overlay.docked { align-items: flex-end; justify-content: center; background: linear-gradient(180deg, rgba(5,4,3,0) 25%, rgba(5,4,3,.85) 55%); }
  .card.dock { width: 100%; margin-top: 52vw; }
  .overlay.titled { justify-content: center; align-items: flex-end; background: linear-gradient(180deg, rgba(5,4,3,.1) 20%, rgba(5,4,3,.92) 60%); }
  .title { margin: 0 auto; width: 100%; }
  canvas#cu { position: fixed; z-index: 9; object-fit: contain; background: #000; }
}
</style>

<div class="stage">
  <canvas id="cv" width="800" height="560" aria-label="The kitchen"></canvas>
  <div class="overlay" id="ov"></div>
  <canvas id="cu" hidden aria-label="Close-up"></canvas>
</div>
<div class="bar">
  <small>mouse / touch / space</small>
  <div style="display:flex;gap:8px">
    <button id="menuBtn" type="button">Menu</button>
    <button id="snd" type="button">Sound on</button>
  </div>
</div>

<script>
(() => {
const W = 800, H = 560, LS = 0.4, LW = 320, LH = 224;
const cv = document.getElementById('cv');
const dctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
const lc = document.createElement('canvas'); lc.width = LW; lc.height = LH;
const lctx = lc.getContext('2d', { willReadFrequently: true });
const ov = document.getElementById('ov');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const pick = a => a[Math.floor(Math.random() * a.length)];
const TAU = Math.PI * 2;
function seeded(s) { s = s % 2147483647 || 1; return () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646); }

/* ---------- text queue: drawn crisp after the low-res pass ---------- */
let TQ = [];
function T(s, x, y, size = 24, col = '#d9cfb8', align = 'center') { TQ.push([s, x, y, size, col, align]); }

/* ---------- feel: shake, red flash ---------- */
let shake = 0, flashR = 0;
function hurt(a = .5) { flashR = Math.max(flashR, a * .6); shake = Math.max(shake, a * 12); }

/* ---------- sound ---------- */
let AC = null, master = null, muted = false, drone = false, lastMoan = 0;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d = .12, type = 'square', vol = .05, slide = 0) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), n = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), n + d);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
  o.connect(g).connect(master); o.start(n); o.stop(n + d + .02);
}
function noise(d = .2, vol = .05, freq = 1000) {
  const a = ac(); if (!a) return;
  const len = Math.floor(a.sampleRate * d), b = a.createBuffer(1, len, a.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), n = a.currentTime;
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
  s.connect(f).connect(g).connect(master); s.start(n);
}
function startDrone() {
  if (drone || !ac()) return; drone = true;
  const a = AC, g = a.createGain(), lp = a.createBiquadFilter();
  g.gain.value = .04; lp.type = 'lowpass'; lp.frequency.value = 180;
  for (const f of [41.2, 41.7, 61.7]) { const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); }
  const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = .05; lg.gain.value = 90; lfo.connect(lg).connect(lp.frequency); lfo.start();
  lp.connect(g).connect(master);
}
const moan = () => { const n = performance.now(); if (n - lastMoan < 160) return; lastMoan = n; tone(rnd(140, 220), .35, 'sawtooth', .025, -60); noise(.25, .03, rnd(700, 1400)); };
const sGood = () => { tone(196, .9, 'sine', .07); tone(293, .7, 'sine', .03); };
const sBad = () => { tone(55, .5, 'sawtooth', .07, -20); noise(.2, .05, 250); };
const sChop = () => { noise(.09, .1, 2400); tone(110, .08, 'square', .04, -50); };
const sGurgle = () => { for (let i = 0; i < 3; i++) setTimeout(() => { tone(rnd(50, 80), .15, 'sine', .07, rnd(-20, 30)); noise(.12, .03, 300); }, i * 110); };
const sRattle = () => { for (let i = 0; i < 4; i++) setTimeout(() => noise(.05, .06, 3000), i * 60); };
const sChime = () => { tone(1567, 1.2, 'sine', .025); tone(1661, 1.2, 'sine', .02); };
const sScream = () => { tone(rnd(500, 700), .6, 'sawtooth', .04, -300); noise(.5, .05, 1800); };
const sThump = () => { tone(52, .18, 'sine', .14, -10); setTimeout(() => tone(46, .16, 'sine', .1, -10), 150); };
document.getElementById('snd').onclick = e => { muted = !muted; if (master) master.gain.value = muted ? 0 : 1; e.target.textContent = muted ? 'Sound off' : 'Sound on'; };

/* ---------- storage ---------- */
let best = {};
try { best = JSON.parse(localStorage.getItem('gristle-best') || '{}') || {}; } catch (e) { best = {}; }
function saveBest() { try { localStorage.setItem('gristle-best', JSON.stringify(best)); } catch (e) {} }

/* ---------- tiny PS1-style 3D ---------- */
function rotV(v, rx, ry, rz) {
  let [x, y, z] = v, c, s;
  if (rx) { c = Math.cos(rx); s = Math.sin(rx); [y, z] = [y * c - z * s, y * s + z * c]; }
  if (ry) { c = Math.cos(ry); s = Math.sin(ry); [x, z] = [x * c + z * s, -x * s + z * c]; }
  if (rz) { c = Math.cos(rz); s = Math.sin(rz); [x, y] = [x * c - y * s, x * s + y * c]; }
  return [x, y, z];
}
function Sph(o) {
  const lat = o.lat || 5, lon = o.lon || 8, [rx, ry, rz] = o.r, R = seeded(o.seed || 7), nz = o.noise || 0;
  const v = [], f = [];
  const push = (x, y, z) => { const m = 1 + (R() - .5) * 2 * nz; let p = [x * rx * m, y * ry * m, z * rz * m]; if (o.rot) p = rotV(p, ...o.rot); v.push([p[0] + o.pos[0], p[1] + o.pos[1], p[2] + o.pos[2]]); };
  push(0, 1, 0);
  for (let i = 1; i < lat; i++) { const th = i / lat * Math.PI; for (let j = 0; j < lon; j++) { const ph = j / lon * TAU; push(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)); } }
  push(0, -1, 0);
  const last = v.length - 1, ring = i => 1 + (i - 1) * lon;
  for (let j = 0; j < lon; j++) f.push([0, ring(1) + j, ring(1) + (j + 1) % lon]);
  for (let i = 1; i < lat - 1; i++) for (let j = 0; j < lon; j++) {

// THE WALL: take the right eyes, best when they shine. Streaks pay; mistakes make it bleed and speed up. Sometimes something big opens.
function Harvest(m) {
  const inv = m === 'invert';
  const g = { dur: 20, now: 0, spawnT: .3, pts: 0, combo: 0, dread: 0, holes: [], big: null, bigT: rnd(4.5, 6.5), pop: [] };

  const ripe = h => isTarget(h.open) && h.life < h.max * .55 && h.life > h.max * .2;
  const say = (s, x, y, col) => g.pop.push({ s, x, y, col, t: .7 });
  g.update = dt => {
    g.now += dt; g.spawnT -= dt; g.dread = Math.max(0, g.dread - dt * .08);
    const ramp = clamp(g.now / g.dur);

    }

        if (h.blinkAt > 0 && h.life < h.blinkAt) { h.open = !h.open; h.blinkAt = -1; }
        if (h.life <= 0) { h.on = false; if (isTarget(h.open)) { g.pts -= .5; g.combo = 0; } }
      } else h.up = Math.max(0, h.up - dt * 6);
    }

    g.pop = g.pop.filter(p => (p.t -= dt) > 0);
  };
  g.down = (x, y) => {
    if (g.big && Math.hypot(x - 400, y - 300) < 80) {
      if (isTarget(g.big.open)) { g.big.hits++; burst(x, y, '#6e1410', 10); tone(120 + g.big.hits * 40, .2, 'sine', .07); if (g.big.hits >= 3) { g.pts += 6; g.combo += 2; sGood(); say('+6', 400, 230, '#9da35a'); burst(400, 300, '#cfc6ae', 30, 320); g.big = null; } }
      else { g.pts -= 4; g.combo = 0; g.dread = Math.min(1, g.dread + .5); hurt(.8); sScream(); g.big = null; }
      return;
    }
    let best = null, bd = 50;
    for (const h of g.holes) { if (!h.on || h.up < .5) continue; const d = Math.hypot(x - h.x, y - (h.y - 60 * h.up)); if (d < bd) { bd = d; best = h; } }

      const mult = 1 + Math.min(1.5, Math.floor(g.combo / 4) * .5), v = (ripe(best) ? 2 : 1) * mult;
      g.pts += v; g.combo++; sGood(); burst(best.x, best.y - 60, '#cfc6ae', ripe(best) ? 14 : 8);

    } else { g.pts -= 2; g.combo = 0; g.dread = Math.min(1, g.dread + .35); sBad(); hurt(.45); burst(best.x, best.y - 60, '#6e1410', 16); say('-2', best.x, best.y - 100, '#a3241a'); }
    best.on = false; best.up = 0;

      c.fillStyle = '#050404'; c.beginPath(); c.arc(x + Math.cos(a) * r * .4, y + Math.sin(a) * r * .4, r * .23, 0, TAU); c.fill();
    } else {
      c.fillStyle = '#8f7262'; c.beginPath(); c.arc(x, y, r * 1.03, Math.PI * .9, Math.PI * 2.1); c.fill();
      c.fillStyle = '#7a5e50'; c.beginPath(); c.arc(x, y, r * 1.03, Math.PI * .1, Math.PI * .9); c.fill();
      if (glow) { c.strokeStyle = '#c8b46a'; c.lineWidth = 3; c.beginPath(); c.arc(x, y, r * 1.08, 0, TAU); c.stroke(); }
      c.strokeStyle = '#140a08'; c.lineWidth = 3; c.beginPath(); c.moveTo(x - r, y + 4); c.lineTo(x + r, y + 4); c.stroke();
      for (let v = -2; v <= 2; v++) { const sx = x + v * r * .37; c.beginPath(); c.moveTo(sx - 4, y - 4); c.lineTo(sx + 4, y + 12); c.moveTo(sx + 4, y - 4); c.lineTo(sx - 4, y + 12); c.stroke(); }
    }
  }

    if (g.dread > .1) { c.fillStyle = `rgba(90,12,8,${g.dread * .35})`; for (let i = 0; i < 6; i++) c.fillRect(120 + i * 95, 40, 10, 120 + Math.sin(i * 7) * 80 + g.dread * 200); }
    for (const h of g.holes) {
      c.fillStyle = '#140e0b'; c.beginPath(); c.ellipse(h.x, h.y, 55, 18, 0, 0, TAU); c.fill();
      c.strokeStyle = '#3a2a1f'; c.lineWidth = 4; c.beginPath(); c.ellipse(h.x, h.y, 55, 18, 0, Math.PI, TAU); c.stroke();

        c.strokeStyle = '#4e1a1e'; c.lineWidth = 11; c.beginPath(); c.moveTo(h.x, h.y); c.quadraticCurveTo(h.x + Math.sin(t * 4 + h.x) * 10, h.y - 30 * h.up, h.x, ey); c.stroke();

        if (h.on) { c.strokeStyle = 'rgba(217,207,184,.45)'; c.lineWidth = 3; c.beginPath(); c.arc(h.x, ey, 37, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(h.life / h.max)); c.stroke(); }

/* ---------- post-processing: grade, 15-bit quantize, ordered dither, grain ---------- */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function postFX(c, w, h, grain = 16) {
  const id = c.getImageData(0, 0, w, h), d = id.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, b = (BAYER[(y & 3) * 4 + (x & 3)] / 16 - .5) * 9, n = (Math.random() - .5) * grain;
    let r = d[i], g = d[i + 1], bl = d[i + 2];
    const l = r * .3 + g * .59 + bl * .11;
    r = r * .62 + l * .38 + 5 + b + n; g = g * .62 + l * .38 + 3 + b + n; bl = bl * .55 + l * .33 + b + n;
    d[i] = Math.max(0, Math.min(255, r)) & 0xF8; d[i + 1] = Math.max(0, Math.min(255, g)) & 0xF8; d[i + 2] = Math.max(0, Math.min(255, bl)) & 0xF8;
  }
  c.putImageData(id, 0, 0);
}

const LAB_TWIST = { dark: 'The lamp is failing.', drift: 'The floor is not level tonight.', lag: 'Your hands arrive late.', flicker: 'Something keeps blowing out the light.', pulse: 'The room is breathing.', quake: 'Your hands will not stop shaking.' };
const LAB_GLYPH = { dark: '●', drift: '∿', lag: '…', flicker: '✶', pulse: '◎', quake: '≈' };
function labIngredient(R) {
  const pickR = a => a[Math.floor(R() * a.length)], kinds = Object.keys(LAB_NOUN), kind = pickR(kinds);
  return { kind, name: `${pickR(LAB_ADJ)} ${pickR(LAB_NOUN[kind])}`, hue: pickR([0, 0, 0, 18, -22, 35, 150, 200, 290]), sat: +(.75 + R() * .55).toFixed(2) };
}
// well-mixed seeded random (neighbouring book numbers must not look alike)
function labRng(seed) { let a = (seed ^ 0x9E3779B9) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function labStep(R, ing, diff, guest, forced) {
  const pickR = a => a[Math.floor(R() * a.length)];
  const mech = forced || pickR(Object.keys(LAB_MECH).filter(k => LAB_MECH[k].kinds.includes(ing.kind)));
  const opts = GAMES[mech].sup.filter(x => guest.pool.includes(x));
  const m = opts.length && R() < .25 + diff * .5 ? pickR(opts) : null;
  const names = Object.keys(LAB_TWIST).sort(() => R() - .5);
  const nTw = diff > .75 ? 1 + (R() < .5 ? 1 : 0) : diff > .35 ? (R() < .6 ? 1 : 0) : (R() < .15 ? 1 : 0);
  const tw = { speed: +(.85 + diff * .35 + (R() - .5) * .1).toFixed(2), hue: ing.hue, sat: ing.sat };
  const twists = names.slice(0, nTw); twists.forEach(n => { tw[n] = true; });
  const durMul = +(1.2 - diff * .4 + (R() - .5) * .1).toFixed(2);
  const lvl = (tw.speed - .85) / .4 + (1.2 - durMul) / .4 + nTw * .6 + (m ? .5 : 0);
  return { mech, m, title: `${pickR(LAB_MECH[mech].verbs)} the ${ing.name}`, hint: STEPS[mech].hint, durMul, tw, twists, lvl, ing };
}
function labDish(seed) {
  const R = labRng(seed), pickR = a => a[Math.floor(R() * a.length)];
  const diff = R(), guest = diff > .85 ? GUESTS[3] : GUESTS[Math.floor(R() * 3)];

  const ings = [], want = 2 + (R() < .4 ? 1 : 0);
  while (ings.length < want) { const ing = labIngredient(R); if (!ings.some(i => i.kind === ing.kind)) ings.push(ing); }
  const pool = Object.keys(LAB_MECH).filter(k => ings.some(i => LAB_MECH[k].kinds.includes(i.kind))).sort(() => R() - .5);
  const n = Math.max(ings.length, Math.min(pool.length, 2 + Math.floor(R() * 3)));
  const plan = [];

  for (const mech of pool) { if (plan.length >= n) break; if (!plan.some(p => p[0] === mech)) plan.push([mech, pickR(ings.filter(x => LAB_MECH[mech].kinds.includes(x.kind)))]); }
  plan.sort(() => R() - .5);

  const form = pickR(LAB_FORM);
  const name = R() < .5 ? `${ings[0].name} ${form}` : `${form} of ${ings[0].name}${ings[1] ? ' and ' + ings[1].name.split(' ').pop() : ''}`;

}
function drawLabDish(c, d, x, y, s) {
  const R = labRng(d.seed * 31 + 7), rgbOf = k => LAB_COL[k], base = rgbOf(d.ings[0].kind), alt = rgbOf((d.ings[1] || d.ings[0]).kind);
  c.save(); c.translate(x, y);
  c.fillStyle = '#2a2520'; c.beginPath(); c.ellipse(0, s * .45, s * 1.1, s * .28, 0, 0, TAU); c.fill();
  const bowl = ['Broth', 'Stew', 'Soup', 'Pottage'].includes(d.form);
  if (bowl) { c.fillStyle = '#2c2622'; c.beginPath(); c.moveTo(-s * .8, 0); c.quadraticCurveTo(0, s * .9, s * .8, 0); c.closePath(); c.fill(); c.fillStyle = rgb(base.map(v => v * .7)); c.beginPath(); c.ellipse(0, 0, s * .8, s * .14, 0, 0, TAU); c.fill(); }
  else if (d.form === 'Pie') { c.fillStyle = '#8a5a2a'; c.beginPath(); c.ellipse(0, 0, s * .8, s * .45, 0, 0, TAU); c.fill(); c.fillStyle = rgb(LAB_COL.crust); c.beginPath(); c.ellipse(0, -s * .05, s * .72, s * .38, 0, 0, TAU); c.fill(); c.strokeStyle = '#5a0f0c'; c.lineWidth = 2.5; c.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * TAU * 2 / 5; i ? c.lineTo(Math.cos(a) * s * .35, -s * .05 + Math.sin(a) * s * .2) : c.moveTo(Math.cos(a) * s * .35, -s * .05 + Math.sin(a) * s * .2); } c.closePath(); c.stroke(); }
  else if (d.form === 'Sausage') { c.strokeStyle = rgb(base); c.lineWidth = s * .22; c.lineCap = 'round'; c.beginPath(); c.arc(0, 0, s * .45, .3, TAU * .95); c.stroke(); }
  else { c.fillStyle = rgb(base); c.beginPath(); for (let i = 0; i <= 24; i++) { const a = Math.PI + i / 24 * Math.PI, rr = s * (.65 + R() * .1); i ? c.lineTo(Math.cos(a) * rr, s * .3 + Math.sin(a) * rr * .8) : c.moveTo(Math.cos(a) * rr, s * .3 + Math.sin(a) * rr * .8); } c.closePath(); c.fill(); c.fillStyle = 'rgba(255,240,220,.25)'; c.beginPath(); c.ellipse(-s * .2, -s * .1, s * .2, s * .08, -.3, 0, TAU); c.fill(); }

    const gx = (R() - .5) * s * .9, gy = -s * .15 - R() * s * .25;
    if (ing.kind === 'eyes') for (let i = 0; i < 2; i++) { c.fillStyle = '#c9c0a6'; c.beginPath(); c.arc(gx + i * s * .22, gy, s * .11, 0, TAU); c.fill(); c.fillStyle = '#050404'; c.beginPath(); c.arc(gx + i * s * .22, gy + s * .02, s * .045, 0, TAU); c.fill(); }
    else if (ing.kind === 'bone') { c.save(); c.translate(gx, gy); c.rotate(R() - .5); c.fillStyle = '#d9cfb8'; c.fillRect(-s * .3, -s * .04, s * .6, s * .08); c.beginPath(); c.arc(-s * .3, 0, s * .06, 0, TAU); c.arc(s * .3, 0, s * .06, 0, TAU); c.fill(); c.restore(); }
    else if (ing.kind === 'eel' || ing.kind === 'root') { c.strokeStyle = rgb(rgbOf(ing.kind)); c.lineWidth = s * .06; c.lineCap = 'round'; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(gx + i * s * .12, gy + s * .1); c.bezierCurveTo(gx + i * s * .12 + s * .2, gy - s * .2, gx - s * .2, gy - s * .3, gx + (R() - .5) * s * .3, gy - s * .5); c.stroke(); } }
    else if (ing.kind === 'yolk') { c.fillStyle = rgb(LAB_COL.yolk); for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(gx + (R() - .5) * s * .4, gy + (R() - .5) * s * .15, s * .07, 0, TAU); c.fill(); } }
    else if (ing.kind === 'flesh') { c.fillStyle = rgb(alt); for (let i = 0; i < 3; i++) { c.beginPath(); c.ellipse(gx + (R() - .5) * s * .5, gy, s * .1, s * .07, R(), 0, TAU); c.fill(); } }
    else if (ing.kind === 'crust') { c.fillStyle = rgb(LAB_COL.crust); for (let i = 0; i < 6; i++) c.fillRect(gx + (R() - .5) * s * .6, gy + (R() - .5) * s * .2, s * .05, s * .05); }

}
let labBook = 1000 + Math.floor(Math.random() * 9000);
// life = true: the book in your room. Tonight's page is fixed and the dish you pick is your night.
function labMenu(life) {
  mode = 'idle'; mut = null; game = null; parts = []; twx = null; mirrorReset();
  const book = life ? 50000 + (L.book || 0) * 97 + L.day : labBook;
  const dishes = [0, 1, 2].map(i => labDish(book * 3 + i));
  const stepLine = s => `${s.title}${s.m ? ' ' + SIGIL[s.m] : ''}${s.twists.map(t => ' ' + LAB_GLYPH[t]).join('')}`;
  const cards = dishes.map((d, i) => `<button class="dish" data-i="${i}" type="button">
      <canvas data-i="${i}" width="160" height="100"></canvas>
      <strong>${d.name}</strong><span>${d.blurb}</span>
      <span class="steps">${d.steps.map(stepLine).join('<br>')}</span>
      <span class="rating" aria-label="Difficulty ${d.rating} of 5">${'◆'.repeat(d.rating)}${'◇'.repeat(5 - d.rating)}</span>
      ${life ? `<span class="pay">+${Math.round(d.rating * 1.5 * (1 + .25 * L.up.shrine))} extra teeth${d.steps.some(s => s.twists.length) ? ` · −${d.steps.reduce((n, s) => n + s.twists.length, 0) * 2} extra mind` : ''}</span>` : ''}</button>`).join('');

    ? `<button id="close" class="ghost" type="button">Close the book</button>`

  show(`<div class="card wide"><div class="txt"><span class="eyebrow">${life ? `Night ${L.day} · the book on the table` : `The Lab · book ${labBook}`}</span>
      ${life ? `<p class="omen">The pages were blank yesterday.</p>
        <p class="bookhow">Cook one of these tonight instead of the usual dishes downstairs. Stranger recipes pay more teeth, the more ◆ the more. The small marks after a step are things that will be wrong down there, and each one costs a little extra mind. You can close the book and go down as normal.</p>` : ''}<div class="menu">${cards}</div>
      <div class="btns">${controls}</div></div></div>`, n => {
    n.querySelectorAll('canvas[data-i]').forEach(cn => { const x = cn.getContext('2d', { willReadFrequently: true }); x.fillStyle = '#0d0b09'; x.fillRect(0, 0, 160, 100); x.save(); x.scale(.5, .5); drawLabDish(x, dishes[+cn.dataset.i], 160, 110, 70); x.restore(); postFX(x, 160, 100, 22); });

function startLab(d, life) {

    <h2>${d.guest.name}</h2>
    <p class="omen">${d.guest.line}</p>
    <p>${d.ings.map(i => i.name).join(' · ')}</p>

function labVerdict() {
  const avg = Math.round(run.scores.reduce((a, b) => a + b, 0) / run.scores.length), st = starsFor(avg), g = run.guest, d = run.labDish;

/* ---------- HUD (full-res, over the dithered frame) ---------- */
function drawHUD(c) {
  c.fillStyle = 'rgba(5,4,3,.85)'; c.fillRect(0, 0, W, 40);
  c.fillStyle = '#d9cfb8'; c.font = '28px VT323, monospace'; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(game.info.title.toUpperCase(), 16, 21);
  const tw = 180, tx = W - tw - 16, f = clamp(timer / game.dur);
  c.fillStyle = '#1b1814'; c.fillRect(tx, 14, tw, 12);
  c.fillStyle = f < .25 ? '#a3241a' : '#6b6152'; c.fillRect(tx, 14, tw * f, 12);
  const hl = L ? clamp((40 - L.mind) / 40) : 0, liar = !mut && hl > 0 && Math.sin(TT * 2.3) > 1 - hl * .3;
  if (mut || liar) { c.fillStyle = mut === 'mirror' && mir.on ? '#d9cfb8' : '#a3241a'; c.font = '28px serif'; c.textAlign = 'right'; c.fillText(mut ? SIGIL[mut] : Object.values(SIGIL)[Math.floor(TT / 4) % 3], tx - 14, 21); }
  c.textBaseline = 'alphabetic';
  c.fillStyle = '#5e564a'; c.font = '22px VT323, monospace'; c.textAlign = 'right'; c.fillText(game.info.hint, W - 16, 545);
}
function drawGlass(c, t) {
  if (mut !== 'mirror') return;
  if (mir.phase === 'warn') {
    const a = .12 + .12 * Math.abs(Math.sin(t * 18));
    for (const [x0, dir] of [[0, 1], [W, -1]]) { const g2 = c.createLinearGradient(x0, 0, x0 + dir * 140, 0); g2.addColorStop(0, `rgba(200,210,215,${a})`); g2.addColorStop(1, 'rgba(200,210,215,0)'); c.fillStyle = g2; c.fillRect(Math.min(x0, x0 + dir * 140), 40, 140, H - 40); }
  }
  if (mir.on) {
    c.fillStyle = 'rgba(170,185,195,.07)'; c.fillRect(0, 40, W, H - 40);
    c.strokeStyle = 'rgba(200,210,215,.35)'; c.lineWidth = 1.5; c.setLineDash([6, 8]); c.beginPath(); c.moveTo(W / 2, 40); c.lineTo(W / 2, H); c.stroke(); c.setLineDash([]);
    c.strokeStyle = 'rgba(217,207,184,.5)'; c.lineWidth = 2; c.beginPath(); c.arc(rp.x, rp.y, 9, 0, TAU); c.stroke();

  }
}

/* ---------- loop ---------- */
let lastT = performance.now(), TT = 0;
const ROLE = () => run ? run.guest.id : null;
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; TT += dt;
  flick = reduced ? .95 : .9 + .07 * Math.sin(TT * 13) * Math.sin(TT * 7.3) - (Math.random() < .015 ? .5 : 0);
  TQ = [];
  shake = Math.max(0, shake - dt * 30); flashR = Math.max(0, flashR - dt * 1.6);
  const sk = reduced ? 0 : shake, sx = rnd(-sk, sk), sy = rnd(-sk, sk);
  const c = lctx; c.setTransform(LS, 0, 0, LS, sx * LS, sy * LS);
  // a worn mind sees things; a worn body shakes the hand
  const halluc = L ? clamp((40 - L.mind) / 40) : 0, tremA = (L ? clamp((45 - L.body) / 45) * 9 : 0) + (twx && twx.quake ? 7 : 0);

    if (halluc > 0 && mode === 'play' && Math.random() < dt * halluc * .4) noise(.6, .02 * halluc, rnd(300, 900));
    const sdt = dt * (mut === 'hyper' ? 1.45 : 1) * (twx ? twx.speed : 1);
    if (ROLE()) render3D(c, CHARS[ROLE()], TT, 722, 160, CHARS[ROLE()].sc * .75, 1 / LS, .55 + (mir.on ? .4 : 0));

      if (timer / game.dur < .3) { beatT -= sdt; if (beatT <= 0) { sThump(); beatT = .55 + timer / game.dur; } }
      if (timer <= 0 || (game.done && game.done())) { mode = 'end'; endT = 1; lastScore = Math.round(game.score()); ptr.down = false; if (mir.on) setMirror(false); }

    drawParts(c, dt);
    drawTwistOverlays(c);

    render3D(c, CHARS.ashe, TT, 180, 300, 130, 1 / LS, .9);
    drawParts(c, dt);
  }

  d.drawImage(lc, 0, 0, W, H);
  d.fillStyle = 'rgba(0,0,0,.18)'; for (let y = 0; y < LH; y++) d.fillRect(0, y * 2.5 + 1.6, W, .8);
  if (flashR > 0) { d.fillStyle = `rgba(140,10,6,${flashR})`; d.fillRect(0, 0, W, H); }
  for (const [s, x, y, size, col, align] of TQ) { d.font = `${size}px VT323, monospace`; d.textAlign = align; d.fillStyle = '#000'; d.fillText(s, x + 2, y + 2); d.fillStyle = col; d.fillText(s, x, y); }
  if (game && mode !== 'idle') {
    drawGlass(d, TT);
    drawHUD(d);
    if (mode === 'ready') {
      readyT -= dt; d.fillStyle = 'rgba(0,0,0,.45)'; d.fillRect(0, 40, W, H - 40);
      d.font = '64px VT323, monospace'; d.textAlign = 'center'; d.fillStyle = '#d9cfb8'; if (readyT < .45) d.fillText('NOW', 400, 300);

    } else if (mode === 'end') {

      if (endT <= 0) { mode = 'idle'; game = null; mut = null; twx = null; resultCard(lastScore); }
    }
  }

    const p = portrait.c; p.setTransform(1, 0, 0, 1, 0, 0);
    const g2 = p.createRadialGradient(56, 40, 4, 56, 56, 80); g2.addColorStop(0, '#2a221b'); g2.addColorStop(1, '#030202');
    p.fillStyle = g2; p.fillRect(0, 0, 112, 112);

  requestAnimationFrame(frame);
}
loadLife();
titleScreen();
requestAnimationFrame(frame);
})();
